# Python playbook.
#
# Python's tooling is fragmented, so this playbook leans on the pyproject.toml-driven
# tools (pytest, ruff, mypy) rather than the older setup.cfg equivalents.

id: python
title: Python
priority: 60

match:
  files: ['pyproject.toml', 'requirements.txt', 'setup.py', 'setup.cfg', 'Pipfile']
  deps: ['python', 'django', 'flask', 'fastapi', 'pytest', 'ruff', 'mypy', 'poetry', 'uv']
  importPrefixes: ['django.', 'flask.', 'fastapi.']

official:
  docs:
    - label: Python documentation
      url: 'https://docs.python.org/3/'
      why: >-
        The language reference and standard library docs. Check the version your project
        declares in `requires-python` before relying on newer syntax.
    - label: Django documentation
      url: 'https://docs.djangoproject.com/en/stable/'
      why: >-
        Query semantics, migration machinery and settings precedence are all documented
        precisely here, and getting them subtly wrong is the usual cause of "it works in
        tests" bugs.
  skills:
    - label: Django deployment checklist
      url: 'https://docs.djangoproject.com/en/stable/howto/deployment/checklist/'
      why: >-
        The canonical list of production settings. Useful when an agent edits settings.py
        or adds middleware.
  agents: []
  mcp: []
  styleGuides:
    - label: PEP 8
      url: 'https://peps.python.org/pep-0008/'
      why: >-
        The default Python style. Prefer a repo's own documented style when one exists;
        this is the fallback.
      # The fallback is redundant once the repo declares a style of its own. A config file
      # is the only signal that can be checked without reading it, so a repo that keeps
      # its rules in `setup.cfg` or `.flake8` counts as satisfied; one that keeps them in
      # `pyproject.toml` does not, and is still offered this.
      satisfiedBy: ['**/setup.cfg', '**/.flake8', '**/.editorconfig']
  migrationGuides:
    - label: Django deployment and upgrade notes
      url: 'https://docs.djangoproject.com/en/stable/releases/'
      why: >-
        Read the release notes for the target version before upgrading: removed APIs and
        changed defaults are the usual source of silent breakage.

community:
  - repo: 'astral-sh/ruff'
    stars: 40000
    label: Ruff
    why: >-
      The fast linter and formatter most modern Python repos standardise on. Its rule
      documentation explains what each check actually catches.
    satisfiedBy: ['**/ruff.toml', '**/.ruff.toml']
  - repo: 'pytest-dev/pytest'
    label: pytest
    why: >-
      The documentation for markers, fixtures and `-k` selection is the reference for the
      fast-test subset the audit looks for.
    satisfiedBy: ['**/pytest.ini']

verify:
  build: ['python -m build', 'poetry build']
  test: ['pytest', 'python -m pytest']
  # `pytest -k changed` is not here: `-k` filters on a test *name*, so it matches nothing
  # unless the project names its changed tests that way. `-m "not slow"` is a real marker.
  testFast: ['pytest -m "not slow"']
  lint: ['ruff check .', 'flake8 .']
  format: ['ruff format .', 'black .']
  typecheck: ['mypy .', 'pyright']

conventions:
  moduleLayout: 'src/ layout with a tests/ directory alongside'
  testNaming: 'test_*.py, *_test.py'
  reviewFocus:
    - 'database migrations, which are hard to reverse'
    - 'dependency pins and lockfile changes'
    - 'anything that changes import side effects'

riskGlobs:
  - '**/migrations/**'
  - '**/alembic/**'
  - '**/settings.py'
  - '**/requirements*.txt'
  - '**/poetry.lock'
  - '**/uv.lock'
# Live-discovery seeds; see android.yaml for why this section exists.
discover:
  officialOrgs: ['python', 'pypa']
  keywords:
    - 'python mcp server'
    - 'django agent'
    - 'fastmcp'
  mcp: ['python', 'django', 'fastapi']
