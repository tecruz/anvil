# Release workflow.
#
# Triggered by a version tag (`v0.1.0`, `v0.2.0`, ...). Builds the prebuilt tarball
# exactly once, installs it into an isolated consumer project and smoke-tests the
# installed binary, then publishes those same bytes to the registry with provenance.
#
# The bundle is never rebuilt after testing: if the build changes, the tag moves and a
# new release is cut. Pull-request CI has no publish credentials and cannot publish.
#
# The published package is the scoped workspace `@anvil/cli` (ADR-0012), because the
# unscoped `anvil` name belongs to an unrelated package on npm. The repository root stays
# the git-install unit (ADR-0007); it is not the registry target.
#
# Secrets:
#   NPM_TOKEN — an npm auth token with publish access to `@anvil/cli`. Scoped to this
#     workflow only; ordinary PR jobs never see it.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write    # OIDC for npm provenance, when the registry supports it

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The same checks CI runs on every PR, so a release is never cut from broken source.
      - name: check (lint, typecheck, test, build)
        run: npm run check

      # Pack the scoped workspace that is the registry target (ADR-0012), not the root:
      # the root is the git-install unit and its unscoped name is unavailable on npm.
      # npm always includes README and LICENSE found beside the manifest, and this
      # workspace carries neither, so stage the root copies first. `--pack-destination`
      # requires the directory to exist, so create it instead of assuming it survives
      # `npm ci`.
      - name: pack the distribution tarball
        run: |
          mkdir -p dist
          cp LICENSE README.md packages/cli/
          npm pack --workspace @anvil/cli --pack-destination dist

      # Verify the tarball contains only the allowlisted files.
      - name: verify tarball contents
        run: |
          tarball=$(ls dist/*.tgz)
          echo "packed: $tarball"
          tar tzf "$tarball"

      # Record the tarball checksum and the source commit for provenance. The path is
      # absolute because `npm publish` treats a bare relative path as a package spec.
      - name: record checksum and provenance
        id: provenance
        run: |
          tarball=$(realpath dist/*.tgz)
          checksum=$(sha256sum "$tarball" | cut -d' ' -f1)
          source_sha=$(git rev-parse HEAD)
          version=${GITHUB_REF_NAME#v}
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # Install the tarball into an isolated consumer project and smoke-test the
      # installed binary: version and JSON doctor. This is the artifact that is
      # published, tested exactly as it will be received.
      - name: smoke-test the installed tarball
        run: |
          consumer=$(mktemp -d)
          echo '{"name":"consumer","private":true,"scripts":{"test":"node -e \"process.exit(0)\""}}' > "$consumer/package.json"
          npm install --no-save "${{ steps.provenance.outputs.tarball }}" --prefix "$consumer"

          bin="$consumer/node_modules/.bin/anvil"
          case "$(uname)" in
            MINGW*|MSYS*|CYGWIN*|Windows_NT) bin="$bin.cmd" ;;
          esac

          # 1. Reports its own version.
          "$bin" version --json
          # 2. JSON envelope survives bundling.
          "$bin" doctor --json

      # Publishing cannot be undone, so every identity this release claims must agree
      # first: the tag, the workspace manifest (the package npm receives), and the
      # packed artifact that was just smoke-tested.
      - name: verify the release identity
        env:
          TAG_VERSION: ${{ steps.provenance.outputs.version }}
        run: |
          tarball="${{ steps.provenance.outputs.tarball }}"
          tar -xOf "$tarball" package/package.json | TAG_VERSION="$TAG_VERSION" node -e '
            const fs = require("node:fs")
            const packed = JSON.parse(fs.readFileSync(0, "utf8"))
            const manifest = require("./packages/cli/package.json")
            const tag = process.env.TAG_VERSION
            if (packed.name !== manifest.name) {
              throw new Error(`tarball is ${packed.name}, the workspace manifest is ${manifest.name}`)
            }
            if (packed.name !== "@anvil/cli") {
              throw new Error(`this workflow publishes @anvil/cli, not ${packed.name}`)
            }
            if (packed.version !== manifest.version) {
              throw new Error(`tarball is ${packed.version}, the workspace manifest is ${manifest.version}`)
            }
            if (tag !== manifest.version) {
              throw new Error(`tag is v${tag}, the workspace manifest is ${manifest.version}`)
            }
            console.log(`release identity: ${packed.name}@${packed.version} from tag v${tag}`)
          '
          # The allowlist must actually carry the command the smoke test ran.
          bin_path=$(node -p "require('./packages/cli/package.json').bin.anvil")
          tar tzf "$tarball" | grep -qx "package/${bin_path#./}"

      # Publish the exact bytes that were tested. `npm publish` with no argument would
      # repack the working tree and re-run `prepare`, so the registry could receive a
      # different build than the one the smoke test approved.
      - name: publish the tested tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ steps.provenance.outputs.tarball }}" --provenance --access public
