# Release workflow.
#
# Triggered by a version tag (`v0.1.0`, `v0.2.0`, ...), or by a manual dispatch as a
# no-publish rehearsal. Both paths build the prebuilt tarball exactly once, install it
# into an isolated consumer project, smoke-test the installed binary, record its checksum
# and retain the tested bytes. Only the tag path publishes to the registry.
#
# The rehearsal exists because a release cannot be undone: it exercises the GitHub steps
# that were previously only rehearsed locally -- the artifact upload and the job summary --
# without ever calling `npm publish`. A dispatch on a branch has no tag, so the candidate
# version comes from the workspace manifest; a dispatch on a `v*` tag rehearses that tag's
# identity gate instead. Dispatching is not an approval to publish: publication still
# requires an explicit version tag push and the maintainer's decision.
#
# The bundle is never rebuilt after testing: if the build changes, the tag moves and a
# new release is cut. Pull-request CI has no publish credentials and cannot publish.
#
# The published package is the scoped workspace `@anvil-workflows/cli` (ADR-0023),
# because the unscoped `anvil` name and the `@anvil` scope belong to unrelated packages on
# npm. The repository root stays the git-install unit (ADR-0007); it is not the registry
# target.
#
# Secrets:
#   NPM_TOKEN — an npm auth token with publish access to `@anvil-workflows/cli`. Read only by
#     the tag-only publish job; the preparation job and rehearsal never need it.

name: Release

on:
  push:
    tags: ['v*']
  # Rehearse the exact release steps without publishing. No inputs: a branch dispatch takes
  # the candidate from the checked-out manifest, and a dispatch on a `v*` tag rehearses that
  # tag's identity gate.
  workflow_dispatch:

# Preparation and rehearsal run with read-only permissions. OIDC is granted only to the
# tag-gated publish job, after the artifact has been tested and retained.
permissions:
  contents: read

# One run per ref and event, and never cancel one mid-flight: a tag release in progress must
# not be killed by a dispatch of the same ref. The event is part of the key so a rehearsal
# can never replace a queued release (or vice versa) on the same ref.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ github.event_name == 'workflow_dispatch' && 'Release rehearsal (no publish)' || format('Release {0}', github.ref_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Export what the publish job needs. Job outputs survive a retry of only that job, so a
    # failed publication can resume against the artifact this job already tested and retained.
    outputs:
      artifact_id: ${{ steps.upload_evidence.outputs['artifact-id'] }}
      checksum: ${{ steps.provenance.outputs.checksum }}
      source_sha: ${{ steps.provenance.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job never pushes; leaving the token in .git/config only widens exposure.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # The same checks CI runs on every PR, so a release is never cut from broken source.
      - name: check (lint, typecheck, test, build)
        run: npm run check

      # Pack the scoped workspace that is the registry target (ADR-0023), not the root:
      # the root is the git-install unit and its unscoped name is unavailable on npm.
      # npm always includes README and LICENSE found beside the manifest, and this
      # workspace carries neither, so stage the root copies first. `--pack-destination`
      # requires the directory to exist, so create it instead of assuming it survives
      # `npm ci`.
      - name: pack the distribution tarball
        run: |
          mkdir -p dist
          cp LICENSE README.md packages/cli/
          npm pack --workspace @anvil-workflows/cli --pack-destination dist

      # Enforce the allowlist, do not merely print it. A publish is irreversible, so an
      # unexpected entry -- source, tests, a stray credential -- has to fail here rather
      # than be read by a human who will not see it again.
      - name: verify tarball contents
        run: |
          tarball=$(ls dist/*.tgz)
          echo "packed: $tarball"
          entries=$(tar tzf "$tarball")
          echo "$entries"

          unexpected=$(printf '%s\n' "$entries" | grep -v -E '^(package/|package/package\.json|package/README\.md|package/LICENSE|package/dist/cli\.js)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::the tarball contains files outside the allowlist:"
            echo "$unexpected"
            exit 1
          fi

          for required in package/dist/cli.js package/package.json package/README.md package/LICENSE; do
            printf '%s\n' "$entries" | grep -qx "$required" || {
              echo "::error::the tarball is missing $required"
              exit 1
            }
          done

      # Record the tarball checksum and the source commit for provenance. The path is
      # absolute because `npm publish` treats a bare relative path as a package spec.
      - name: record checksum and provenance
        id: provenance
        run: |
          tarball=$(realpath dist/*.tgz)
          checksum=$(sha256sum "$tarball" | cut -d' ' -f1)
          source_sha=$(git rev-parse HEAD)
          # One decision for both outputs: a `v*` tag is the claim being released (or
          # rehearsed), and anything else -- a branch dispatch -- has no tag to compare
          # against, so its candidate version comes from the manifest. The script prints
          # `version` and `rehearsal` together, so the identity gate below cannot compare a
          # version chosen under a different rule than the one that selected the gate.
          identity=$(node scripts/resolve-release-ref.mjs)
          printf '%s\n' "$identity" >> "$GITHUB_OUTPUT"
          version=$(printf '%s\n' "$identity" | sed -n 's/^version=//p')
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          # Sidecars live outside the tarball: preserving evidence must not repack or
          # change the bytes that the installed-binary smoke test receives.
          printf '%s  %s\n' "$checksum" "$(basename "$tarball")" > dist/SHA256SUMS
          printf '## @anvil-workflows/cli@%s\n\nSource commit: `%s`\n\nTarball: `%s`\n\nSHA-256: `%s`\n' \
            "$version" "$source_sha" "$(basename "$tarball")" "$checksum" > dist/RELEASE_NOTES.md

      # Install the tarball into an isolated consumer project and smoke-test the
      # installed binary: version, JSON doctor, and the MCP handshake. This is the
      # artifact that is published, tested exactly as it will be received.
      #
      # `--ignore-scripts` is part of the test, not an optimisation: the registry channel
      # exists so that installing does not run a source build the way the git channel does.
      # If the bundle needed an install step, this is where that would show up.
      - name: smoke-test the installed tarball
        env:
          TARBALL: ${{ steps.provenance.outputs.tarball }}
        run: |
          consumer=$(mktemp -d)
          echo '{"name":"consumer","private":true,"scripts":{"test":"node -e \"process.exit(0)\""}}' > "$consumer/package.json"
          npm install --no-save --ignore-scripts "$TARBALL" --prefix "$consumer"

          bin="$consumer/node_modules/.bin/anvil"
          case "$(uname)" in
            MINGW*|MSYS*|CYGWIN*|Windows_NT) bin="$bin.cmd" ;;
          esac

          # 1. Reports its own version.
          "$bin" version --json
          # 2. JSON envelope survives bundling.
          "$bin" doctor --json
          # 3. The MCP transport is installed surface, not a checkout-only convenience.
          #    Drive the real handshake so a bundle that dropped it fails before publishing.
          #    The validator is `scripts/check-mcp-handshake.ts`, the same module the
          #    packaging test imports: its regression cases therefore exercise this gate
          #    rather than a lookalike. It parses the responses instead of grepping for an
          #    id, because an `initialize` that returned a JSON-RPC error still contains one.
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "$bin" mcp > "$RUNNER_TEMP/mcp.jsonl"
          node scripts/check-mcp-handshake.ts "$RUNNER_TEMP/mcp.jsonl"

      # Publishing cannot be undone, so every identity this release claims must agree
      # first: the tag, the workspace manifest (the package npm receives), and the
      # packed artifact that was just smoke-tested. The comparison lives in a script so the
      # test can run the exact gate, including the tag-versus-manifest case.
      - name: verify the release identity
        env:
          TAG_VERSION: ${{ steps.provenance.outputs.version }}
          TARBALL: ${{ steps.provenance.outputs.tarball }}
          # Produced by the same step that chose the version, so the two cannot disagree.
          REHEARSAL: ${{ steps.provenance.outputs.rehearsal }}
        run: |
          tar -xOf "$TARBALL" package/package.json | node scripts/verify-release-identity.mjs
          # The allowlist must actually carry the command the smoke test ran.
          bin_path=$(node -p "require('./packages/cli/package.json').bin.anvil")
          tar tzf "$TARBALL" | grep -qx "package/${bin_path#./}"

      # Check again after every command that exercised the installed artifact. A changed
      # tarball must not be archived as approved evidence or sent to the registry.
      - name: the tested tarball still matches its recorded checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      # Logs and step outputs expire; keep the exact tested bytes and their source/hash
      # together. These files also supply the notes/checksum for an approved GitHub release.
      # Upload failure is blocking, before publication, not an optional post-publish report.
      - name: retain the tested tarball, checksum and draft release notes
        id: upload_evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.event_name == 'workflow_dispatch' && 'rehearsal-' || '' }}${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 90

      # Claim success only after the upload the previous step depends on has succeeded.
      - name: retain the release evidence in the job summary
        run: |
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n%s\n' 'Evidence retained: the tested tarball, its checksum and the draft notes were uploaded.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf '%s\n' 'Release rehearsal: registry publication was skipped. No registry bytes changed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  # No preparation job has the token or OIDC. Only a real version tag can reach publish, and
  # it receives the exact artifact the preparation job tested and retained.
  publish:
    name: Publish ${{ github.ref_name }}
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: release
    runs-on: ubuntu-latest
    # The job that holds NPM_TOKEN: bound how long it can hold it.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write    # OIDC for npm provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          # No `cache: npm`: this job installs nothing, and a miss would save an unrelated
          # ~/.npm under the lockfile key that CI and `release` restore.
          registry-url: 'https://registry.npmjs.org'

      - name: recover the tested artifact
        # Download by the id the preparation job uploaded, not by a name rebuilt from this
        # job's run attempt: retrying only `publish` keeps the earlier artifact and outputs.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: dist
          # With artifact-ids, the action otherwise nests files under the artifact name.
          # Keep the single retained tarball and its sidecars directly in dist/.
          merge-multiple: true

      - name: verify the artifact before publication
        env:
          ARTIFACT_DIR: dist
          EXPECTED_CHECKSUM: ${{ needs.release.outputs.checksum }}
          SOURCE_SHA: ${{ needs.release.outputs.source_sha }}
          TAG_VERSION: ${{ github.ref_name }}
        run: node scripts/verify-release-artifact.mjs

      # Publish the exact bytes that were tested. No build runs in this job: `npm publish` with
      # no argument would repack the working tree and could send a different artifact.
      - name: publish the tested tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$(realpath dist/*.tgz)" --provenance --access public
