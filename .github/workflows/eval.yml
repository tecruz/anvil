# The real-model benchmark.
#
# This is deliberately not part of `ci.yml`. CI proves the code works; this answers a
# different question over time: does the context anvil derives still help a model? It
# spends tokens (unless the selected model is free) and needs provider credentials, so it
# runs on a schedule rather than on every push, and it is not a required check.
#
# The weekly run uses the `small` role: the same four-scenario matrix, two variants each,
# which is the cheapest signal that can still detect a regression. A manual dispatch can
# run the frontier model when the spend is intended.
#
# `eval:check` is the verdict for the committed hermetic evidence. A real-agent run is
# deliberately never promoted into that summary, so this workflow gates its own run with
# `--check-run <runId>`: the same expectations and provenance checks, against the record
# this invocation produced, writing `benchmark-summary.json` instead of `latest.json`. The
# harness exits 0 even when a scenario fails, because a failed run is a measurement; both
# gates, not the harness, turn a missed baseline expectation or a recorded agent error into
# a red job. A run that nobody reads is not a benchmark.
#
# SECRETS: configure `OPENCODE_API_KEY` for the small (Zen) model and/or
# `OPENROUTER_API_KEY` for the frontier model as repository secrets, or on the `eval`
# environment. `--models all` needs both.
#
# COST: every scenario runs the agent twice (bare and anvil) under a 10-minute agent
# timeout. One role is eight runs, so the 60-minute job ceiling is a hard spend bound
# rather than a guarantee that `all` (sixteen runs) finishes. Dispatch `frontier` or `all`
# only when that spend is wanted.
#
# A dispatch with `rehearse_failure` skips that job and runs a hermetic rehearsal instead:
# it produces bounded evidence, proves the gate rejects tampered evidence, then fails on
# purpose so the always() upload can demonstrate artifact retention. No model is called and
# the rehearsal receives no provider keys.
#
# PINNING: the OpenCode 2 package, `@opencode/cli`, is pinned to an exact version because
# the harness records the version and two weeks have to be comparable. Bump it deliberately.
name: Eval benchmark

on:
  schedule:
    # Mondays at 04:17 UTC. The odd minute avoids the top-of-hour rush on hosted runners.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      models:
        description: Which model role to run
        type: choice
        options: [small, frontier, all]
        default: small
      rehearse_failure:
        description: Run the hermetic failure rehearsal instead of a real benchmark
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eval-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: real-model benchmark
    # A rehearsal dispatch must never reach the model-running path. Scheduled runs and a
    # normal dispatch without rehearse_failure keep this job exactly as before.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.rehearse_failure != true }}
    runs-on: ubuntu-latest
    # Eight agent runs with a 10-minute per-run timeout, plus setup, is the realistic
    # weekly case. The ceiling is what a hung provider cannot exceed; `all` can hit it and
    # be cut short, which is the intended spend bound rather than a silent overrun.
    timeout-minutes: 60
    # Referencing an environment with no rules behaves like a plain job, so this costs
    # nothing now and gives maintainers a place to add secrets or required reviewers.
    environment: eval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The checked-in summary, run record, and promoted-record archive describe an earlier,
      # hermetic run. Remove them before any setup step can fail, so the always() upload
      # below cannot publish stale results as this run's evidence.
      - name: discard the checked-out summary
        run: rm -rf eval-results/latest.json eval-results/run.json eval-results/runs

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # The CLI the harness invokes is part of what is being measured, so it is installed
      # explicitly rather than assumed to exist on the runner.
      - name: install the agent
        run: |
          npm install --global @opencode/cli@2.1.4
          opencode --version

      # Check the credential the selected role actually needs, before spending setup time
      # and failing halfway through the matrix with an opaque provider error.
      - name: provider credentials are configured
        env:
          MODELS: ${{ inputs.models || 'small' }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Match the CLI's role selection, including a comma-separated pair. The comma
          # delimiters keep "small" from matching the "all" role as a substring.
          ROLES=",$(printf '%s' "$MODELS" | tr -d '[:space:]'),"
          missing=0
          case "$ROLES" in
            *,small,*|*,all,*)
              if [ -z "$OPENCODE_API_KEY" ]; then
                echo '::error::OPENCODE_API_KEY is required for the small (Zen) model.'
                missing=1
              fi
              ;;
          esac
          case "$ROLES" in
            *,frontier,*|*,all,*)
              if [ -z "$OPENROUTER_API_KEY" ]; then
                echo '::error::OPENROUTER_API_KEY is required for the frontier model.'
                missing=1
              fi
              ;;
          esac
          exit "$missing"

      # The harness copies its environment to the agent under test. Hand it only the key the
      # selected role needs, and never the job token; checkout no longer persists it either.
      - name: run the matrix
        env:
          ANVIL_EVAL: '1'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODELS: ${{ inputs.models || 'small' }}
        shell: bash
        run: |
          ROLES=",$(printf '%s' "$MODELS" | tr -d '[:space:]'),"
          case "$ROLES" in
            *,frontier,*|*,all,*) ;; # the frontier role needs the OpenRouter key
            *) unset OPENROUTER_API_KEY ;;
          esac
          case "$ROLES" in
            *,small,*|*,all,*) ;; # the small role needs the OpenCode key
            *) unset OPENCODE_API_KEY ;;
          esac
          unset GITHUB_TOKEN ROLES
          npm run eval -- --models "$MODELS" --repetitions 1 --order alternate

      # Bind the gate to this invocation. `run.json` is the only run record this checkout
      # produced; naming its id means a leftover record from another run cannot pass as this
      # one's evidence.
      - name: identify the run
        id: matrix
        run: |
          if [ ! -f eval-results/run.json ]; then
            echo '::error::the benchmark harness wrote no run record.'
            exit 1
          fi
          # A single-line UUID is the only safe value for $GITHUB_OUTPUT and the step log.
          if ! RUN_ID=$(node -e "const id=JSON.parse(require('node:fs').readFileSync('eval-results/run.json','utf8')).runId; if (typeof id!=='string' || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) process.exit(2); process.stdout.write(id)"); then
            echo '::error::the benchmark run record names no UUID run id.'
            exit 1
          fi
          echo "runId=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Benchmark run id: $RUN_ID"

      # The real-agent gate. `eval:check` compares the committed fake-agent summary with the
      # baseline, and the harness never promotes a real-agent run into that file. `--check-run`
      # validates the run named above against the same baseline expectations and provenance
      # checks, and writes a separate benchmark summary. Every failure is blocking.
      - name: gate the real-agent run against the baseline
        env:
          MODELS: ${{ inputs.models || 'small' }}
          RUN_ID: ${{ steps.matrix.outputs.runId }}
        run: |
          if [ -z "$RUN_ID" ]; then
            echo '::error::the benchmark run wrote no run record, so there is no evidence to gate.'
            exit 1
          fi
          npm run eval -- --check-run "$RUN_ID" --models "$MODELS" --repetitions 1 --order alternate

      # Report the run the gate validated, not the checked-out hermetic summary. On a failed
      # gate no validated summary exists, and this says so instead of presenting stale evidence.
      - name: publish the summary
        if: always()
        run: |
          {
            echo '## Real-agent eval'
            echo '```json'
            if test -f eval-results/benchmark-summary.json; then
              node -e 'const fs=require("node:fs"); const tick=String.fromCharCode(96); const fence=tick.repeat(3); const gap=tick+" "+tick+" "+tick; process.stdout.write(fs.readFileSync("eval-results/benchmark-summary.json","utf8").split(fence).join(gap))'
            else
              echo '{"error":"the benchmark gate validated no run; see the gate step"}'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Retain benchmark artifacts even after failure: the run record and checkpoints, plus
      # benchmark-summary.json when the gate passes. A real-agent run does not write the raw
      # reports or the promoted-record archive; those belong to hermetic promotion only.
      # `latest.json` is deliberately not uploaded -- it is the checked-in hermetic evidence.
      - name: upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-artifacts-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            eval-results/benchmark-summary.json
            eval-results/run.json
            eval-results/runs/**/*.json
            eval-results/checkpoints/**/*.json
            eval-results/raw/*.json
          retention-days: 30

  # A hermetic rehearsal of the retention contract. It never calls a model and receives no
  # provider credentials. The deliberate failure at the end is the demonstration, not an
  # accident: the always() upload below has to retain the bounded evidence written earlier.
  rehearsal:
    name: hermetic failure rehearsal
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearse_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Anything checked in describes an earlier run. Drop it so this rehearsal cannot
      # accidentally present stale evidence as its own.
      - name: discard checked-out evidence
        run: rm -rf eval-results/latest.json eval-results/run.json eval-results/runs eval-results/checkpoints eval-results/raw eval-results/benchmark-summary.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: run the hermetic matrix
        run: npm run eval -- --fake-agent --repetitions 1 --order alternate

      - name: confirm the healthy gate passes
        run: npm run eval:check

      - name: tamper with hermetic evidence and write the rehearsal record
        env:
          REHEARSAL_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const latestPath = 'eval-results/latest.json'
          const runPath = 'eval-results/run.json'
          const latest = JSON.parse(fs.readFileSync(latestPath, 'utf8'))
          const run = JSON.parse(fs.readFileSync(runPath, 'utf8'))
          const result = latest.results.find(
            (entry) => entry.scenario === 'tiny-code-change' && entry.variant === 'bare',
          )
          if (result === undefined) throw new Error('tiny-code-change/bare result is missing')
          result.verified = false
          result.verifyExitCodes = [1, ...result.verifyExitCodes.slice(1)]
          fs.writeFileSync(latestPath, `${JSON.stringify(latest, null, 2)}\n`)
          const record = {
            evidence: 'hermetic-failure-rehearsal',
            generatedAt: new Date().toISOString(),
            githubRunId: process.env.REHEARSAL_RUN_ID,
            runId: run.runId,
            sourceCommit: process.env.GITHUB_SHA,
            tampered: 'tiny-code-change/bare: verified=false, first verifyExitCode=1',
            expectedGate: 'reject',
            note: 'Synthetic rehearsal evidence only. No model was called and no tokens were spent.',
          }
          fs.writeFileSync('eval-results/failure-rehearsal.json', `${JSON.stringify(record, null, 2)}\n`)
          NODE

      # A blocking assertion: if the gate accepts the tampered summary, the rehearsal fails
      # here and the record is wrong. A rejected gate is the expected outcome.
      - name: assert the gate rejects the tampered evidence
        run: |
          if npm run eval:check > eval-results/gate-rejection.log 2>&1; then
            cat eval-results/gate-rejection.log
            echo '::error::the hermetic gate accepted tampered evidence.'
            exit 1
          fi
          echo 'The hermetic gate rejected the tampered evidence, as expected.'
          cat eval-results/gate-rejection.log

      - name: fail the rehearsal on purpose
        run: |
          echo '::error::synthetic failure rehearsal; the allowlisted artifacts must be retained.'
          exit 1

      - name: publish rehearsal summary
        if: always()
        run: |
          {
            echo '## Hermetic failure rehearsal'
            echo ''
            echo 'This job failed on purpose after writing bounded evidence.'
            echo 'The hermetic gate was asserted to reject tampered evidence.'
            echo 'Retained: failure-rehearsal.json, gate-rejection.log, run.json, runs/ and checkpoints/.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload rehearsal artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-failure-rehearsal-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            eval-results/failure-rehearsal.json
            eval-results/gate-rejection.log
            eval-results/run.json
            eval-results/runs/**/*.json
            eval-results/checkpoints/**/*.json
          if-no-files-found: error
          retention-days: 30
