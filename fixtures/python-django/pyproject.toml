[project]
name = "acme-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "django>=5.0",
  "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
